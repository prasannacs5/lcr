name: lcr
runtime: python
command:
  - "uvicorn"
  - "backend.main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"
env:
  - name: DATABRICKS_WAREHOUSE_ID
    value: "d9cffc17706c30bc"
  - name: LCR_GENIE_SPACE_ID
    value: "01f123d006e91b97aad469ecbc444560"
  - name: LCR_CATALOG
    value: "banking_cfo_treasury"
  - name: LCR_SCHEMA
    value: "aura_bank"
  - name: LCR_LLM_ENDPOINT_NAME
    value: "databricks-claude-sonnet-5"
  - name: DATABRICKS_SUMMARY_MODEL
    value: "databricks-claude-sonnet-5"
resources:
  - name: sql-warehouse
    sql_warehouse:
      id: "d9cffc17706c30bc"
      permission: CAN_USE
  - name: serving-endpoint-claude
    serving_endpoint:
      name: "databricks-claude-sonnet-5"
      permission: CAN_QUERY
